<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myIQ Quiz</title>
    <meta
      name="description"
      content="myIQ-style IQ quiz interface with timed question flow and progress tracking."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/i18n.js"></script>
  </head>
  <body class="quiz-body">
    <header class="quiz-header">
      <div class="quiz-header-inner container">
        <a href="index.html" class="brand quiz-brand" aria-label="Home">
          <span class="brand-mark">
            <span class="mark-circle"></span>
            <span class="mark-circle small"></span>
          </span>
          <span class="brand-text">myIQ</span>
        </a>

        <div class="quiz-timer" id="quizTimer" aria-live="polite">00:00</div>
      </div>

      <div class="progress-track" aria-label="Test progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </header>

    <main class="quiz-main">
      <div id="quizScreen" class="quiz-screen" aria-live="polite"></div>
    </main>

    <script src="/quiz.js"></script>
  </body>
</html>
